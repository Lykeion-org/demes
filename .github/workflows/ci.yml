name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod has no local replace
        run: |
          if grep -nE '=>[[:space:]]*(\.|/)' go.mod; then
            echo "::error file=go.mod::go.mod replaces a module with a local path; pin a published version instead"
            exit 1
          fi
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
